<!DOCTYPE html>
<html lang="en">
	<head>
		<title>QRCode</title>
		<meta charset="utf-8">
		<meta content="notranslate" name="google">
		<meta content="yes" name="mobile-web-app-capable">
		<meta content="yes" name="apple-mobile-web-app-capable">
		<meta content="width=device-width,initial-scale=1,maximum-scale=1,shrink-to-fit=no,user-scalable=0,viewport-fit=cover" name="viewport">
		<meta property="og:url" content="https://starfid.github.io/qrcode/">
		<meta property="og:type" content="article">
		<meta property="og:title" content="QRCode Generator">
		<meta property="og:description" content="Free with save to png download button. For qrcode version 1, maximum 17 characters length">
		<style>
			html {-webkit-text-size-adjust:100%}
			svg {border:solid 1px rgb(200,200,200);}
			form {margin:1vw 0 0 0;display:flex}
			table {font-family:arial}
			span {color:rgb(200,200,200)}			
			table, input[type='text'],select {font-size:2vh}
			span {font-size:2vh}
			input[type='button'], select {cursor:pointer}
			input[type='button'] {font-size:2vh;padding:1vh 2vh;}
			@media screen and (max-width: 1000px) { /*phone size below 1000 pixel*/
				table, input[type='text'],select {font-size:5vw}
				span {font-size:3vw}
				input[type='button'] {font-size:5vw;padding:1vw 2vw}
			}
		</style>
	</head>
	<body>
		<svg id="qr" width="200" height="200" shape-rendering="crispEdges"></svg>
		<form>
			<table cellpadding="10">
				<tr>
					<td valign="top">Text</td>
					<td><input type="text" value="" maxlength="17" id="text"> <span>Max 17 chars</span></td>
				</tr>
				<tr>
					<td>Size</td>
					<td>
						<select id="size">
							<option value="50">50</option>
							<option value="100">100</option>
							<option value="200" selected>200</option>
							<option value="300">300</option>
							<option value="400">400</option>
							<option value="500">500</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>Padding</td>
					<td>
						<select id="padding">
							<option value="1">1</option>
							<option value="2" selected>2</option>
							<option value="3">3</option>
							<option value="4">4</option>
						</select>
					</td>
				</tr>
				<tr>
					<td></td>
					<td>
						<input type="button" value="Create" onclick="create()" style="background-color:blue;color:white">
						<input type="button" value="Download" onclick="download()">
					</td>
				</tr>
			</table>			
		</form>
		<script>
			const $$ = (s, c = document) => [...c.querySelectorAll(s)];
			const $ = (s, c = document) => c.querySelector(s);
			function making(text) {
				let N = 21;             // version 1 = 21x21 squares, max 17 chars

				// ---------- 1. TEXT -> BITS ----------
				let bits = [];
				function add(value, count) {            // add 'count' bits of 'value'
					for (let i = count - 1; i >= 0; i--) bits.push((value >> i) & 1);
				}
				add(4, 4);                              // mode: byte
				add(text.length, 8);                    // text length
				for (let i = 0; i < text.length; i++) add(text.charCodeAt(i), 8);
				add(0, 4);                              // end marker
				while (bits.length % 8) bits.push(0);   // fill to full byte

				let data = [];                          // bits -> bytes
				for (let i = 0; i < bits.length; i += 8) {
					data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
				}
				for (let pad = 0xEC; data.length < 19; pad ^= 0xEC ^ 0x11) data.push(pad); // pad to 19 bytes

				// ---------- 2. ERROR CORRECTION (Reed-Solomon, 7 bytes) ----------
				let exp = [], log = [], x = 1;
				for (let i = 0; i < 255; i++) {
					exp[i] = x; log[x] = i;
					x <<= 1;
					if (x > 255) x ^= 0x11D;
				}
				function mul(a, b) { return a && b ? exp[(log[a] + log[b]) % 255] : 0; }

				let gen = [1];                          // generator polynomial
				for (let i = 0; i < 7; i++) {
					let next = [];
					for (let j = 0; j <= gen.length; j++) next[j] = 0;
					for (let j = 0; j < gen.length; j++) {
						next[j] ^= gen[j];
						next[j + 1] ^= mul(gen[j], exp[i]);
					}
					gen = next;
				}

				let ec = [0, 0, 0, 0, 0, 0, 0];         // divide data by generator, remainder = ec
				for (let i = 0; i < data.length; i++) {
					let factor = data[i] ^ ec.shift();
					ec.push(0);
					for (let j = 0; j < 7; j++) ec[j] ^= mul(gen[j + 1], factor);
				}
				let all = data.concat(ec);              // 26 bytes total

				// ---------- 3. DRAW THE GRID ----------
				let cell = [], fixed = [];              // cell = black?, fixed = not for data
				for (let r = 0; r < N; r++) { cell[r] = []; fixed[r] = []; }
				function set(r, c, black) { cell[r][c] = black; fixed[r][c] = true; }

				// three corner squares
				function finder(r0, c0) {
					for (let dr = -1; dr <= 7; dr++) {
						for (let dc = -1; dc <= 7; dc++) {
							let r = r0 + dr, c = c0 + dc;
							if (r < 0 || c < 0 || r >= N || c >= N) continue;
							let d = Math.max(Math.abs(dr - 3), Math.abs(dc - 3));
							set(r, c, d != 2 && d != 4);
						}
					}
				}
				finder(0, 0); finder(0, 14); finder(14, 0);

				// dotted lines
				for (let i = 8; i < 13; i++) { set(6, i, i % 2 == 0); set(i, 6, i % 2 == 0); }

				// format info (level L + mask 0 = 0x77C4)
				let f = 0x77C4;
				function bit(i) { return ((f >> i) & 1) == 1; }
				for (let i = 0; i <= 5; i++) set(i, 8, bit(i));
				set(7, 8, bit(6)); set(8, 8, bit(7)); set(8, 7, bit(8));
				for (let i = 9; i <= 14; i++) set(8, 14 - i, bit(i));
				for (let i = 0; i <= 7; i++) set(8, 20 - i, bit(i));
				for (let i = 8; i <= 14; i++) set(6 + i, 8, bit(i));
				set(13, 8, true);                       // always-black square

				// ---------- 4. PUT DATA BITS (zigzag from bottom-right) ----------
				let n = 0;                              // which data bit
				for (let right = 20; right >= 1; right -= 2) {
					if (right == 6) right = 5;            // skip the dotted column
						for (let v = 0; v < N; v++) {
							for (let j = 0; j < 2; j++) {
								let c = right - j;
								let up = ((right + 1) & 2) == 0;
								let r = up ? N - 1 - v : v;
								if (!fixed[r][c]) {
									let b = (all[n >> 3] >> (7 - (n & 7))) & 1;
									if ((r + c) % 2 == 0) b ^= 1;   // mask pattern 0
										cell[r][c] = b == 1;
									n++;
								}
							}
						}
					}

					// ---------- 5. SHOW IN SVG ----------
					let pad = $('#padding').value;//1; // white border size in squares (4 = standard)
					let size = N + pad * 2;
					
					let svg = $("#qr");
					svg.setAttribute("viewBox", -pad + " " + -pad + " " + size + " " + size);

					let html = '<rect x="-4" y="-4" width="29" height="29" fill="white"/>';
					for (var r = 0; r < N; r++) {
						for (var c = 0; c < N; c++) {
							if (cell[r][c]) html += '<rect x="' + c + '" y="' + r + '" width="1" height="1" fill="black"/>';
					}
				}
				svg.innerHTML = html;
			}
			making('123');
			// ---------- 6. SAVE AS IMAGE ----------
			function savePng() {
				let svg = $("#qr");
				let xml = new XMLSerializer().serializeToString(svg);   // svg -> text
				let size = $('#size').value;

				let img = new Image();
				img.onload = function () {
				let canvas = document.createElement("canvas");
				canvas.width = size;
				canvas.height = size;
				canvas.getContext("2d").drawImage(img, 0, 0, size, size);

				let a = document.createElement("a");
				a.href = canvas.toDataURL("image/png");
				a.download = $('#text').value + ".png";
				a.click();
				};
				img.src = "data:image/svg+xml;base64," + btoa(xml);
			}
			function create(){
				let size = $('#size').value;
				//let padding = $('#padding').value;
				$('#qr').setAttribute('width',size);
				$('#qr').setAttribute('height',size);
				making($('#text').value);
			}
			function download(){
				savePng();
			}
		</script>
	</body>
</html>
